# Traefik local plugins, installed by scripts/vm/45-traefik-plugins.sh under
# ${APPDATA_ROOT}/traefik/plugins-local/src/<module> and loaded by stacks/edge.yaml
# (--experimental.localPlugins.<name>.moduleName=<module>).
#
# One plugin per line: <name> <module> <tag> <commit>
#   name    the plugin key used in stacks/edge.yaml (traefik.http.middlewares.*.plugin.<name>)
#   module  Go module path; cloned from https://<module>
#   tag     release tag to clone
#   commit  full 40-hex commit SHA the tag must point to (the peeled commit for an
#           annotated tag); the install aborts if the tag now points elsewhere
#
# Resolve a commit with: git ls-remote https://<module> 'refs/tags/<tag>*'
# (use the ^{} line when there is one). Upgrade procedure: runbook 04, section 7.
