name: lint

on:
  push:
    branches: ['**']
  pull_request: {}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy env
        run: cp .env.example .env

      - name: Validate compose config
        run: docker compose config -q

      - name: Check pinned images
        run: scripts/ci/check-pinned-images.sh

      - name: Pinned-images check rejects unpinned images
        run: |
          set -euo pipefail
          d=$(mktemp -d)
          printf 'services:\n  web:\n    image: nginx:latest\n  cache:\n    image: redis\n' > "$d/compose.yaml"
          rc=0
          out=$(scripts/ci/check-pinned-images.sh "$d/compose.yaml" 2>&1) || rc=$?
          printf '%s\n' "$out"
          test "$rc" -eq 1
          grep -q 'UNPINNED: nginx:latest' <<<"$out"
          grep -q 'UNPINNED: redis' <<<"$out"

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Shellcheck
        run: shellcheck -x scripts/lib/common.sh scripts/mkdirs.sh scripts/host/*.sh scripts/vm/*.sh scripts/ci/*.sh

      - name: Install yamllint
        run: pip install yamllint

      - name: Yamllint
        run: yamllint -s .

      - name: Sandbox mkdirs + verify (SKIP_HW)
        run: |
          set -euo pipefail
          d=$(mktemp -d)
          DATA_ROOT="$d/data" APPDATA_ROOT="$d/appdata" scripts/mkdirs.sh
          # Second run must be a no-op (idempotence).
          out=$(DATA_ROOT="$d/data" APPDATA_ROOT="$d/appdata" scripts/mkdirs.sh 2>&1)
          printf '%s\n' "$out"
          grep -q 'created 0, existing 16' <<<"$out"
          DATA_ROOT="$d/data" SKIP_HW=1 scripts/vm/verify.sh

      - name: Host-script dry-runs against stubs
        run: |
          set -euo pipefail
          d=$(mktemp -d)
          scripts/ci/make-host-stubs.sh "$d/bin"
          SOURCE_POOL=oldpool PATH="$d/bin:$PATH" scripts/host/05-import-pool.sh
          PATH="$d/bin:$PATH" scripts/host/00-zfs-datasets.sh
          out=$(PATH="$d/bin:$PATH" scripts/host/20-create-vm.sh 2>&1)
          printf '%s\n' "$out"
          grep -q 'DRY-RUN: qm create 200 .*--machine q35' <<<"$out"
          grep -q 'DRY-RUN: qm set 200 --hostpci0 0000:03:00.0,pcie=1' <<<"$out"
          grep -q 'DRY-RUN: qm set 200 --virtiofs0 media-data,cache=auto' <<<"$out"

      - name: IOMMU/vfio dry-run against a fake SYSROOT
        run: |
          set -euo pipefail
          d=$(mktemp -d)
          scripts/ci/make-host-stubs.sh "$d/bin"
          mkdir -p "$d/root/proc" "$d/root/etc/kernel"
          printf 'processor\t: 0\nvendor_id\t: GenuineIntel\n' > "$d/root/proc/cpuinfo"
          echo 'root=ZFS=rpool/ROOT/pve-1 boot=zfs' > "$d/root/etc/kernel/cmdline"
          out=$(SYSROOT="$d/root" PATH="$d/bin:$PATH" scripts/host/10-iommu-vfio.sh 2>&1)
          printf '%s\n' "$out"
          grep -qF "DRY-RUN: sed -i 's/\$/ intel_iommu=on iommu=pt/'" <<<"$out"
          grep -q 'ids=8086:56a5,8086:4f92' <<<"$out"
          grep -q 'softdep i915 pre: vfio-pci' <<<"$out"
          grep -q 'DRY-RUN: update-initramfs -u -k all' <<<"$out"

      - name: IOMMU/vfio FORCE_REFRESH re-runs both refreshes
        run: |
          set -euo pipefail
          d=$(mktemp -d)
          scripts/ci/make-host-stubs.sh "$d/bin"
          mkdir -p "$d/root/proc" "$d/root/etc/default"
          printf 'vendor_id\t: GenuineIntel\n' > "$d/root/proc/cpuinfo"
          # cmdline already configured, vfio files missing: the state left
          # behind when a failed update-grub stopped an earlier --apply.
          echo 'GRUB_CMDLINE_LINUX_DEFAULT="quiet intel_iommu=on iommu=pt"' > "$d/root/etc/default/grub"
          out=$(FORCE_REFRESH=1 SYSROOT="$d/root" PATH="$d/bin:$PATH" scripts/host/10-iommu-vfio.sh 2>&1)
          printf '%s\n' "$out"
          grep -q 'DRY-RUN: update-grub' <<<"$out"
          grep -q 'DRY-RUN: update-initramfs -u -k all' <<<"$out"
          # update-initramfs must come before the bootloader refresh.
          test "$(grep -n 'DRY-RUN: update-initramfs' <<<"$out" | cut -d: -f1)" \
            -lt "$(grep -n 'DRY-RUN: update-grub' <<<"$out" | cut -d: -f1)"

      - name: VM creation guards (existing mapping, RESUME)
        run: |
          set -euo pipefail
          d=$(mktemp -d)
          scripts/ci/make-host-stubs.sh "$d/bin"
          # Existing mapping pointing at the right path: reused, not re-created.
          out=$(STUB_DIR_MAPPING='node=pve,path=/tank/data' PATH="$d/bin:$PATH" scripts/host/20-create-vm.sh 2>&1)
          printf '%s\n' "$out"
          grep -q 'mapping media-data exists -> /tank/data' <<<"$out"
          if grep -q 'DRY-RUN: pvesh create' <<<"$out"; then echo 'unexpected: DRY-RUN: pvesh create'; exit 1; fi
          # Existing mapping pointing elsewhere: refused.
          rc=0
          out=$(STUB_DIR_MAPPING='node=pve,path=/srv/other' PATH="$d/bin:$PATH" scripts/host/20-create-vm.sh 2>&1) || rc=$?
          printf '%s\n' "$out"
          test "$rc" -eq 1
          grep -q 'has no entry node=pve,path=/tank/data' <<<"$out"
          # RESUME=1 into a VM with another name: refused.
          rc=0
          out=$(RESUME=1 STUB_QM_CONFIG='name: other-vm' PATH="$d/bin:$PATH" scripts/host/20-create-vm.sh 2>&1) || rc=$?
          printf '%s\n' "$out"
          test "$rc" -eq 1
          grep -q 'is not named media-01' <<<"$out"
          # RESUME=1 into the right VM: only the missing setting is added.
          out=$(RESUME=1 STUB_QM_CONFIG=$'name: media-01\nhostpci0: 0000:05:00.0,pcie=1' PATH="$d/bin:$PATH" scripts/host/20-create-vm.sh 2>&1)
          printf '%s\n' "$out"
          grep -q 'hostpci0 does not point at the A380' <<<"$out"
          if grep -q 'DRY-RUN: qm create' <<<"$out"; then echo 'unexpected: DRY-RUN: qm create'; exit 1; fi
          if grep -q 'DRY-RUN: qm set 200 --hostpci0' <<<"$out"; then echo 'unexpected: DRY-RUN: qm set 200 --hostpci0'; exit 1; fi
          grep -q 'DRY-RUN: qm set 200 --virtiofs0 media-data,cache=auto' <<<"$out"

      - name: VM bootstrap dry-run against a fake SYSROOT
        run: |
          set -euo pipefail
          d=$(mktemp -d)
          mkdir -p "$d/etc/apt/sources.list.d"
          printf 'ID=debian\nVERSION_CODENAME=trixie\n' > "$d/etc/os-release"
          # The Debian 13 installer's default: non-free (VA driver) is missing.
          printf 'Types: deb\nURIs: http://deb.debian.org/debian/\nSuites: trixie\nComponents: main non-free-firmware\n' \
            > "$d/etc/apt/sources.list.d/debian.sources"
          out=$(SYSROOT="$d" MEDIA_USER=media scripts/vm/00-bootstrap.sh 2>&1)
          printf '%s\n' "$out"
          grep -qF "DRY-RUN: sed -i -E 's/^Components:.*/Components: main contrib non-free non-free-firmware/'" <<<"$out"
          grep -q 'DRY-RUN: apt-get install -y .*intel-media-va-driver-non-free' <<<"$out"
          grep -q 'DRY-RUN: docker network create proxy' <<<"$out"

      - name: Executable bits
        run: test -z "$(find scripts -name '*.sh' ! -path 'scripts/lib/*' ! -perm -u+x)"
