# Download stack — services added in Phase 2 (sabnzbd)
# New services: extends: {file: _common.yaml, service: base} and pin image tags (never :latest).
services:
  sabnzbd:
    extends:
      file: _common.yaml
      service: base
    image: lscr.io/linuxserver/sabnzbd:5.1.1-ls268
    volumes:
      - ${APPDATA_ROOT}/sabnzbd:/config
      - ${DATA_ROOT}:/data
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS \"http://localhost:8080/api?mode=version\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    labels:
      - traefik.enable=true
      - traefik.http.routers.sabnzbd.rule=Host(`sabnzbd.int.${DOMAIN}`)
      - traefik.http.routers.sabnzbd.middlewares=int@docker
      - traefik.http.services.sabnzbd.loadbalancer.server.port=8080

networks:
  proxy:
    name: proxy
    external: true
