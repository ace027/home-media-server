# Arr stack — services added in Phases 2 and 4 (prowlarr, sonarr, sonarr-anime, sonarr-4k, radarr, radarr-4k, lidarr; bazarr, recyclarr, maintainerr)
# New services: extends: {file: _common.yaml, service: base} and pin image tags (never :latest).
services:
  prowlarr:
    extends:
      file: _common.yaml
      service: base
    image: lscr.io/linuxserver/prowlarr:2.5.2.5491-ls156
    volumes:
      - ${APPDATA_ROOT}/prowlarr:/config
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9696/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  sonarr:
    extends:
      file: _common.yaml
      service: base
    image: lscr.io/linuxserver/sonarr:4.0.19.2979-ls321
    volumes:
      - ${APPDATA_ROOT}/sonarr:/config
      - ${DATA_ROOT}:/data
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8989/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  sonarr-anime:
    extends:
      file: _common.yaml
      service: base
    image: lscr.io/linuxserver/sonarr:4.0.19.2979-ls321
    volumes:
      - ${APPDATA_ROOT}/sonarr-anime:/config
      - ${DATA_ROOT}:/data
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8989/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  sonarr-4k:
    extends:
      file: _common.yaml
      service: base
    image: lscr.io/linuxserver/sonarr:4.0.19.2979-ls321
    volumes:
      - ${APPDATA_ROOT}/sonarr-4k:/config
      - ${DATA_ROOT}:/data
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8989/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  radarr:
    extends:
      file: _common.yaml
      service: base
    image: lscr.io/linuxserver/radarr:6.3.0.10514-ls313
    volumes:
      - ${APPDATA_ROOT}/radarr:/config
      - ${DATA_ROOT}:/data
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7878/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  radarr-4k:
    extends:
      file: _common.yaml
      service: base
    image: lscr.io/linuxserver/radarr:6.3.0.10514-ls313
    volumes:
      - ${APPDATA_ROOT}/radarr-4k:/config
      - ${DATA_ROOT}:/data
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:7878/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  lidarr:
    extends:
      file: _common.yaml
      service: base
    image: lscr.io/linuxserver/lidarr:3.1.0.4875-ls39
    volumes:
      - ${APPDATA_ROOT}/lidarr:/config
      - ${DATA_ROOT}:/data
    networks:
      - proxy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8686/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

networks:
  proxy:
    name: proxy
    external: true
