# Shared service template. Consumed by other stack files via:
#   extends: {file: _common.yaml, service: base}
# Do not add an `image:` here; this is a template only, never started directly.
services:
  base:
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ}
      PUID: ${PUID}
      PGID: ${PGID}
      UMASK: ${UMASK}
    # Explicit resolvers: Docker's built-in DNS forwards to the host's resolv.conf
    # list, and a slow or dead first entry (a LAN DNS server) makes lookups time
    # out inside containers. Override in .env (DNS_PRIMARY / DNS_SECONDARY).
    dns:
      - ${DNS_PRIMARY:-1.1.1.1}
      - ${DNS_SECONDARY:-8.8.8.8}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
